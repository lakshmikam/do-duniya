services:
  - type: web
    name: do-duniya-test
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GNANI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: TEST_ACCESS_CODE
        sync: false
      - key: PROVIDER_DAILY_LIMIT
        value: "240"
      - key: ROOM_PROVIDER_LIMIT
        value: "120"
